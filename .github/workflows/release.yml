name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: win-x64
            archive_name: muonline-spawn-converter-win-x64.zip
            binary_name: MuOnline.SpawnConverter.Cli.exe
          - os: linux-x64
            archive_name: muonline-spawn-converter-linux-x64.tar.gz
            binary_name: MuOnline.SpawnConverter.Cli
          - os: osx-x64
            archive_name: muonline-spawn-converter-osx-x64.tar.gz
            binary_name: MuOnline.SpawnConverter.Cli

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Publish Standalone Binary
      run: |
        dotnet publish src/MuOnline.SpawnConverter.Cli \
          -c Release \
          -r ${{ matrix.os }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -o dist/${{ matrix.os }}

    - name: Create Zip Archive (Windows)
      if: matrix.os == 'win-x64'
      run: |
        cd dist/${{ matrix.os }}
        zip -r ../../${{ matrix.archive_name }} .

    - name: Create Tar Archive (Linux & macOS)
      if: matrix.os != 'win-x64'
      run: |
        cd dist/${{ matrix.os }}
        tar -czvf ../../${{ matrix.archive_name }} .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  publish-github-release:
    needs: build-and-package
    name: Publish Release Assets
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download Built Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        merge-multiple: true

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        draft: false
        prerelease: false
        generate_release_notes: true
